name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint src --ext .jsx
      - name: Build
        run: npx vite build --outDir dist
      - name: Verify build output
        run: |
          test -f dist/index.html && echo "✓ dist/index.html produced"
          echo "Build verified."
